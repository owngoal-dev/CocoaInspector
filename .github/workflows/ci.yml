name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cocoa-inspector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build:
    name: Build, verify, and release Debian package
    runs-on: macos-26
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/cocoa-inspector-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Apply release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/apply-version.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

      - name: Build Debian packages with Xcode
        run: |
          xcodebuild -version
          make deb-all CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA"

      - name: Verify Debian packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make --no-print-directory print-version)"
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Inspector.app"
          DAEMON_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/cocoainspectord"
          CLI_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/cocoainspector"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$VERSION" = "${GITHUB_REF_NAME#v}"
          fi
          test "$(lipo -archs "$APP_PATH/Inspector")" = "arm64"
          test "$(lipo -archs "$DAEMON_PATH")" = "arm64"
          test "$(lipo -archs "$CLI_PATH")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")" = "AppIcon"
          test "$(sips -g pixelWidth "$APP_PATH/AppIcon60x60@2x.png" 2>/dev/null | awk '/pixelWidth:/ {print $2}')" = "120"
          test "$(sips -g pixelHeight "$APP_PATH/AppIcon60x60@2x.png" 2>/dev/null | awk '/pixelHeight:/ {print $2}')" = "120"
          test "$(sips -g pixelWidth "$APP_PATH/AppIcon76x76@2x~ipad.png" 2>/dev/null | awk '/pixelWidth:/ {print $2}')" = "152"
          test "$(sips -g pixelHeight "$APP_PATH/AppIcon76x76@2x~ipad.png" 2>/dev/null | awk '/pixelHeight:/ {print $2}')" = "152"
          : >build/Packages/SHA256SUMS
          {
            echo '### Debian packages'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for flavor in roothide rootless; do
            DEB_PATH="$(make --no-print-directory print-deb-path FLAVOR="$flavor")"
            ARCHITECTURE="$(dpkg-deb -f "$DEB_PATH" Architecture)"
            case "$flavor" in
              roothide) PREFIX="" ;;
              rootless) PREFIX="/var/jb" ;;
            esac
            ./Scripts/verify-deb.sh "$DEB_PATH" wiki.qaq.inspector "$VERSION" "$ARCHITECTURE" "$PREFIX"
            dpkg-deb --info "$DEB_PATH"
            dpkg-deb --contents "$DEB_PATH"
            DEB_NAME="$(basename "$DEB_PATH")"
            DEB_SIZE="$(stat -f '%z' "$DEB_PATH")"
            DEB_SHA256="$(shasum -a 256 "$DEB_PATH" | awk '{print $1}')"
            printf '%s  %s\n' "$DEB_SHA256" "$DEB_NAME" >>build/Packages/SHA256SUMS
            {
              echo "- \`$DEB_NAME\` ($flavor, $DEB_SIZE bytes)"
              echo "  - SHA-256: \`$DEB_SHA256\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          cat build/Packages/SHA256SUMS
          {
            echo
            echo "- Artifact: \`CocoaInspector-$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Both flavours package the one build, and neither strip nor ldid touches
      # LC_UUID, so one set of dSYMs matches every shipped binary.
      - name: Archive dSYMs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make --no-print-directory print-version)"
          DSYM_ZIP="$PWD/build/Packages/CocoaInspector_${VERSION}_dSYMs.zip"
          (cd "$DERIVED_DATA/Build/Products/Release-iphoneos" && zip -qry "$DSYM_ZIP" *.dSYM)
          (cd build/Packages && shasum -a 256 "$(basename "$DSYM_ZIP")" >>SHA256SUMS)

      - name: Upload Debian packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CocoaInspector-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/*_dSYMs.zip
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          roothide_deb="$(make --no-print-directory print-deb-path FLAVOR=roothide)"
          rootless_deb="$(make --no-print-directory print-deb-path FLAVOR=rootless)"
          test -f build/Packages/SHA256SUMS
          dsym_zip="build/Packages/CocoaInspector_${version}_dSYMs.zip"
          test -f "$dsym_zip"
          notes="$(mktemp "${TMPDIR:-/tmp}/cocoa-inspector-notes.XXXXXX")"
          trap 'rm -f "$notes"' EXIT
          {
            echo "CocoaInspector $version."
            echo
            echo "| Jailbreak | Package |"
            echo "| --- | --- |"
          } >"$notes"
          for deb_path in "$roothide_deb" "$rootless_deb"; do
            test -f "$deb_path"
            test "$(dpkg-deb -f "$deb_path" Version)" = "$version"
          done
          printf '| roothide | `%s` |\n' "$(basename "$roothide_deb")" >>"$notes"
          printf '| rootless (/var/jb) | `%s` |\n' "$(basename "$rootless_deb")" >>"$notes"
          {
            echo
            echo '```sh'
            echo "sudo dpkg -i <package>.deb"
            echo '```'
            echo
            echo "SHA-256 sums are in \`SHA256SUMS\`."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
          } >>"$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "$roothide_deb" "$rootless_deb" "$dsym_zip" build/Packages/SHA256SUMS
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              "$roothide_deb" "$rootless_deb" "$dsym_zip" build/Packages/SHA256SUMS
          fi
